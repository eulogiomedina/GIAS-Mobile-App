name: Mobile CI/CD – Integración Continua y Construcción de APK (Aplicación GIAS Móvil)

on:
  push:
    branches: [ Jesus, Eulogio ]   # Ejecuta pruebas en ramas de desarrollo
  pull_request:
    branches: [ main ]             # Ejecuta CI antes de hacer merge
  workflow_dispatch:               # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  # 🧩 Fase 1: Integración Continua (CI)
  build-test:
    name: 🔍 Validar proyecto y ejecutar pruebas (Jest + Expo)
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔎 Verificar integridad con Expo Doctor
        run: |
          echo "Ejecutando verificación de Expo Doctor..."
          npx expo doctor || true   # no falla si hay advertencias menores

      - name: 🧪 Ejecutar pruebas automatizadas (Jest)
        run: |
          echo "Ejecutando pruebas automatizadas..."
          npm run test:ci

  # 📦 Fase 2: Entrega Continua (CD)
  build-android:
    name: 📱 Construcción automática del APK (solo en main)
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠 Instalar EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Autenticarse en Expo (con token secreto)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Autenticando en Expo..."
          eas whoami || eas login --token $EXPO_TOKEN

      - name: 🚀 Generar build Android (APK o AAB)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Iniciando build de Android (modo preview)..."
          eas build --platform android --non-interactive --profile preview --output=./build-output
          echo "build_url=https://expo.dev/accounts/eulogio/projects/gias-mobile/builds" >> $GITHUB_OUTPUT

      - name: 🔗 Guardar URL del build como artefacto
        if: success()
        run: |
              echo "URL del build generado: ${{ steps.build.outputs.build_url }}" > build_url.txt

      - name: 📎 Subir artefacto del build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GIAS-Mobile-APK
          path: build-output
