name: Mobile CI – Integración Continua (Aplicación GIAS Móvil)

on:
  push:
    branches: [ Jesus, Eulogio ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: 🔍 Validar proyecto y ejecutar pruebas (CI)
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔎 Verificar integridad con Expo Doctor
        run: bash scripts/run-doctor.sh

      - name: 🧪 Ejecutar pruebas automatizadas (Jest)
        run: bash scripts/run-tests.sh

  build-android:
    name: 📱 Construcción automática del APK (desde main)
    if: github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠 Instalar EAS CLI
        run: npm install -g eas-cli

      - name: 🚀 Generar build Android (APK o AAB)
        id: build
        run: bash scripts/build-android.sh preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔗 Guardar URL del build como artefacto
        if: steps.build.outcome == 'success'
        run: |
          echo "URL del build generado: ${{ steps.build.outputs.build_url }}" > build_url.txt

      - name: 📎 Subir artefacto del build
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-url
          path: build_url.txt
