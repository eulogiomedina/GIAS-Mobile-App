name: Mobile CI/CD – Integración Continua y Construcción de APK (GIAS Móvil)

on:
  push:
    branches: [ Jesus, Eulogio ]        # Ejecuta CI al hacer push a ramas de desarrollo
  pull_request:
    branches: [ main ]                  # Ejecuta CI antes de hacer merge a main
  workflow_dispatch:                    # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  # 🧩 FASE 1: INTEGRACIÓN CONTINUA (CI)
  build-test:
    name: 🔍 Validar proyecto y ejecutar pruebas (Jest + Expo)
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔎 Verificar integridad con Expo Doctor
        run: |
          echo "Ejecutando Expo Doctor..."
          npx expo doctor || true        # No rompe el workflow si hay advertencias menores

      - name: 🧪 Ejecutar pruebas automatizadas (Jest)
        run: |
          echo "Ejecutando pruebas automáticas..."
          npm run test:ci


    # 🚀 FASE 2: ENTREGA CONTINUA (CD) — MAIN o Eulogio
  build-android:
    name: 📱 Construcción automática del APK (main o Eulogio)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Eulogio'
    needs: build-test
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠 Instalar EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Verificar credenciales Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔐 Validando credenciales de Expo..."
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ ERROR: EXPO_TOKEN no está configurado en GitHub Secrets"
            exit 1
          else
            echo "✅ EXPO_TOKEN detectado (token ocultado por seguridad)"
          fi

      - name: 🔐 Autenticarse en Expo (usa token secreto EXPO_TOKEN)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔑 Autenticando en Expo..."
          eas whoami || eas login --token "$EXPO_TOKEN"

      - name: 🚀 Generar build Android (APK o AAB)
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "📱 Iniciando build de Android..."
          eas build --platform android --non-interactive --profile preview --output=./build-output
          echo "build_url=https://expo.dev/accounts/eulogio/projects/gias-mobile/builds" >> $GITHUB_OUTPUT

      - name: 🔗 Guardar URL del build como artefacto
        if: success()
        run: |
          echo "✅ Build generado"
          echo "URL del build: ${{ steps.eas_build.outputs.build_url }}" > build_url.txt

      - name: 📎 Subir artefacto del build (APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-GIAS-Mobile
          path: build-output
