name: Mobile CI/CD – Integración Continua y Construcción de APK (GIAS Móvil)

on:
  push:
    branches: [ Jesus, Eulogio ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 🧩 FASE 1: INTEGRACIÓN CONTINUA (CI)
  build-test:
    name: 🔍 Validar proyecto y ejecutar pruebas (Jest + Expo)
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔎 Verificar integridad con Expo Doctor
        run: |
          echo "🔎 Ejecutando Expo Doctor..."
          npx expo doctor || true

      - name: 🧪 Ejecutar pruebas (Jest)
        run: |
          echo "🧪 Ejecutando pruebas..."
          npm run test:ci


  # 🚀 FASE 2: ENTREGA CONTINUA (CD)
  build-android:
    name: 📱 Construcción automática del APK en Expo Cloud
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Eulogio'
    needs: build-test
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠 Instalar EAS CLI + JQ
        run: |
          npm install -g eas-cli
          sudo apt-get install -y jq

      - name: 🔐 Verificar credenciales de Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ ERROR: No hay EXPO_TOKEN configurado"
            exit 1
          fi

      - name: 🔑 Autenticarse con Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas login --token "$EXPO_TOKEN"

      - name: 🚀 Generar build Android (APK mediante Expo Cloud)
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)
          ARTIFACT_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.builds.android')
          echo "✅ URL generada: $ARTIFACT_URL"
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - name: 🔗 Guardar URL del APK como artefacto
        if: success()
        run: |
          echo "🔗 URL del APK: ${{ steps.eas_build.outputs.artifact_url }}" > build_url.txt

      - name: 📎 Subir URL como artefacto descargable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-GIAS-Mobile
          path: build_url.txt
